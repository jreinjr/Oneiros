<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Phone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Start with black */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 2s ease-in-out;
            color: white;
        }
        
        body.theme-transition {
            {% if theme == 'beauty' %}
            background-color: #4CAF50; /* Green for Beauty */
            {% elif theme == 'truth' %}
            background-color: #2196F3; /* Blue for Truth */
            {% elif theme == 'love' %}
            background-color: #F44336; /* Red for Love */
            {% else %}
            background-color: #4CAF50; /* Default to green */
            {% endif %}
        }
        
        body.fade-to-black {
            background-color: #000000 !important;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            font-size: 2.5em;
            text-align: center;
            padding: 0 20px;
        }
        
        h1.show {
            opacity: 1;
        }
        
        .input-container {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 500px;
        }
        
        .input-container.show {
            opacity: 1;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        button:disabled {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .submit-button {
            width: 100%;
            max-width: 200px;
            margin-top: 10px;
        }
        
        /* Listening spinner */
        .listening-indicator {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .listening-indicator.show {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Radial countdown timer */
        .countdown-timer {
            width: 50px;
            height: 50px;
            position: relative;
            display: none;
        }
        
        .countdown-timer.show {
            display: block;
        }
        
        .spinner.hide {
            display: none;
        }
        
        .countdown-timer svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            display: block;
        }
        
        .countdown-timer circle {
            fill: none;
            stroke-width: 3;
        }
        
        .countdown-timer .background {
            stroke: rgba(255, 255, 255, 0.2);
        }
        
        .countdown-timer .progress {
            stroke: white;
            stroke-dasharray: 151; /* 2 * PI * 24 (radius) */
            stroke-dashoffset: 0;
            stroke-linecap: round;
            transform-origin: center;
            transition: none;
        }
        
        @keyframes countdown {
            from {
                stroke-dashoffset: 0;
            }
            to {
                stroke-dashoffset: 151;
            }
        }
        
        .countdown-timer.active .progress {
            animation: countdown 4s linear forwards;
        }
        
        .listening-text {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
        }
        
        #response {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: transparent;
            border-radius: 5px;
            display: block;
            text-align: center;
            font-size: 1.8em;
            line-height: 1.8;
            width: 90vw;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            visibility: hidden;
            white-space: nowrap;
        }
        
        #response .success {
            display: inline-block;
            white-space: pre-line;
        }
        
        #response .success > div {
            white-space: nowrap;
            overflow: hidden;
        }
        
        #response.show {
            opacity: 1;
            visibility: visible;
        }
        
        .error {
            color: #ffcdd2;
        }
        
        .success {
            {% if theme == 'beauty' %}
            color: #4CAF50; /* Green for Beauty */
            {% elif theme == 'truth' %}
            color: #2196F3; /* Blue for Truth */
            {% elif theme == 'love' %}
            color: #F44336; /* Red for Love */
            {% else %}
            color: #4CAF50; /* Default to green */
            {% endif %}
            font-weight: 500;
            text-shadow: 0 0 20px currentColor;
        }
        
        /* Hide elements initially */
        .hidden {
            display: none !important;
        }
        
        /* Fade out class */
        .fade-out {
            opacity: 0 !important;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>
    <!-- Background audio (not auto-playing) -->
    <audio id="zenAudio" loop>
        <source src="{{ url_for('static', filename='audio/zen.mp3') }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <h1 id="question">{{ question }}</h1>
    
    <div class="listening-indicator" id="listeningIndicator">
        <div class="spinner" id="spinner"></div>
        <div class="countdown-timer" id="countdownTimer">
            <svg viewBox="0 0 56 56">
                <circle class="background" cx="28" cy="28" r="24"></circle>
                <circle class="progress" cx="28" cy="28" r="24"></circle>
            </svg>
        </div>
        <div class="listening-text">Listening...</div>
    </div>
    
    <div class="input-container" id="inputContainer">
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Share your thoughts..." autofocus>
        </div>
        <button class="submit-button" id="submitButton" onclick="sendMessage()">Submit</button>
    </div>
    
    <div id="response"></div>

    <script>
        // Speech recognition variables
        let recognition = null;
        let isRecording = false;
        let silenceTimer = null;
        let lastTranscriptTime = Date.now();
        let restartCount = 0;
        const MAX_RESTARTS = 5;
        let isShowingCountdown = false;
        
        function showSpinner() {
            isShowingCountdown = false;
            document.getElementById('spinner').classList.remove('hide');
            document.getElementById('countdownTimer').classList.remove('show', 'active');
        }
        
        function showCountdown() {
            isShowingCountdown = true;
            document.getElementById('spinner').classList.add('hide');
            document.getElementById('countdownTimer').classList.add('show');
            // Trigger the countdown animation after a brief delay
            setTimeout(() => {
                document.getElementById('countdownTimer').classList.add('active');
            }, 50);
        }
        
        function resetCountdown() {
            const countdownTimer = document.getElementById('countdownTimer');
            const progress = document.querySelector('.countdown-timer .progress');
            
            // Remove active class to stop animation
            countdownTimer.classList.remove('active');
            
            // Reset the animation
            progress.style.animation = 'none';
            
            // Force a reflow
            void progress.offsetWidth;
            
            // Clear inline styles
            progress.style.animation = '';
        }
        
        // Initialize speech recognition if available
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 1;
            // Try to prevent automatic stopping
            recognition.onspeechend = function() {
                // Override default behavior - don't stop on speech end
                return false;
            };
            
            recognition.onstart = function() {
                isRecording = true;
                // Always clear currentUtterance when STT starts
                currentUtterance = '';
                if (restartCount === 0) {
                    // Only clear fullUtterance on initial start, not on restarts
                    fullUtterance = '';
                    showSpinner(); // Show spinner on initial start
                } else {
                    // Show countdown after first restart
                    resetCountdown();
                    showCountdown();
                }
                lastTranscriptTime = Date.now();
                document.getElementById('listeningIndicator').classList.add('show');
                document.getElementById('inputContainer').classList.add('hidden');
            };
            
            recognition.onend = function() {
                // When STT completes, concatenate currentUtterance to fullUtterance
                if (currentUtterance.trim().length > 0) {
                    fullUtterance = (fullUtterance + ' ' + currentUtterance).trim();
                    // Update the input to show the final result
                    document.getElementById('messageInput').value = fullUtterance;
                }
                
                // If we're still supposed to be recording and haven't hit max restarts
                if (isRecording && silenceTimer && restartCount < MAX_RESTARTS) {
                    restartCount++;
                    // Restart recognition to continue listening
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.log('Could not restart recognition:', e);
                            finalizeRecording();
                        }
                    }, 50);
                    return;
                }
                
                // Otherwise, we're done recording
                finalizeRecording();
            };
            
            function finalizeRecording() {
                isRecording = false;
                clearTimeout(silenceTimer);
                restartCount = 0;
                document.getElementById('listeningIndicator').classList.remove('show');
                
                // Instead of showing input container, directly submit if we have text
                if (fullUtterance.trim().length > 0) {
                    // Set the input value to the full utterance
                    document.getElementById('messageInput').value = fullUtterance;
                    // Directly send the message
                    sendMessage();
                } else {
                    // Only show input container if no speech was captured
                    document.getElementById('inputContainer').classList.remove('hidden');
                    document.getElementById('inputContainer').classList.add('show');
                    document.getElementById('messageInput').focus();
                }
            }
            
            let currentUtterance = '';  // Current STT result (gets replaced)
            let fullUtterance = '';     // Complete transcript (accumulates)
            
            recognition.onresult = function(event) {
                // Update activity timestamp
                lastTranscriptTime = Date.now();
                
                // Get the latest result and replace currentUtterance with it
                const latestResult = event.results[event.results.length - 1];
                currentUtterance = latestResult[0].transcript;
                
                // If we're showing countdown and detect voice, switch back to spinner
                if (isShowingCountdown && currentUtterance.trim().length > 0) {
                    showSpinner();
                }
                
                // Display fullUtterance + currentUtterance
                const input = document.getElementById('messageInput');
                input.value = fullUtterance + currentUtterance;
                
                // Only reset timer if we have meaningful content
                if (currentUtterance.trim().length > 2) {
                    // Clear existing silence timer
                    clearTimeout(silenceTimer);
                    
                    // Set new silence timer - wait 5 seconds of silence before stopping
                    silenceTimer = setTimeout(() => {
                        if (fullUtterance.trim().length > 0 || currentUtterance.trim().length > 0) {
                            stopRecording();
                        } else if (restartCount >= MAX_RESTARTS) {
                            // If we've restarted max times with no meaningful content, stop
                            stopRecording();
                        }
                    }, 4000); // 4 seconds of silence before stopping
                }
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                
                // Don't stop on no-speech errors, just continue
                if (event.error === 'no-speech') {
                    return;
                }
                
                stopRecording();
                // Show input field on error
                document.getElementById('inputContainer').classList.remove('hidden');
                document.getElementById('inputContainer').classList.add('show');
            };
        }
        
        function startRecording() {
            try {
                if (recognition) {
                    recognition.start();
                }
            } catch (e) {
                console.error('Failed to start recognition:', e);
                // Show input field if mic fails
                document.getElementById('inputContainer').classList.remove('hidden');
                document.getElementById('inputContainer').classList.add('show');
            }
        }
        
        function stopRecording() {
            if (recognition && isRecording) {
                isRecording = false;
                clearTimeout(silenceTimer);
                silenceTimer = null;
                restartCount = 0;
                recognition.stop();
            }
        }
        
        // Animation sequence on page load
        window.addEventListener('load', function() {
            // Start background color transition immediately
            document.body.classList.add('theme-transition');
            
            // Show question after 3 seconds (2s fade + 1s delay)
            setTimeout(() => {
                document.getElementById('question').classList.add('show');
            }, 3000);
            
            // Try to activate microphone after 5 seconds (2s + 1s + 2s + 1s)
            setTimeout(() => {
                if (recognition) {
                    startRecording();
                } else {
                    // No speech recognition, show input field
                    document.getElementById('inputContainer').classList.add('show');
                }
            }, 5000);
        });
        
        // Allow Enter key to submit
        document.getElementById('messageInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const button = document.getElementById('submitButton');
            const responseDiv = document.getElementById('response');
            const message = input.value.trim();
            
            if (!message) {
                return;
            }
            
            // Disable button and input during request
            button.disabled = true;
            input.disabled = true;
            responseDiv.classList.remove('show');
            
            // Fade out UI elements
            document.getElementById('question').classList.add('fade-out');
            document.getElementById('inputContainer').classList.add('fade-out');
            document.getElementById('listeningIndicator').classList.add('fade-out');
            
            // Start fading background to black after UI fades
            setTimeout(() => {
                document.body.classList.remove('theme-transition');
                document.body.classList.add('fade-to-black');
            }, 1000);
            
            try {
                const response = await fetch('/listen', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Extract the haiku content from the nested response structure
                    const haikuContent = data.user_response?.content || data.user_response?.message || 'No response generated';
                    
                    // Wait for background to be fully black before showing response
                    setTimeout(() => {
                        // Format haiku with line breaks preserved, wrapping each line in a div
                        const lines = haikuContent.split('\n');
                        const formattedHaiku = lines.map(line => `<div>${line}</div>`).join('');
                        responseDiv.innerHTML = `<div class="success">${formattedHaiku}</div>`;
                        
                        // Adjust font size to fit screen width
                        setTimeout(() => {
                            const successDiv = responseDiv.querySelector('.success');
                            let fontSize = 1.8; // Start with 1.8em
                            responseDiv.style.fontSize = fontSize + 'em';
                            
                            // Check each line and shrink font if needed
                            const lineDivs = successDiv.querySelectorAll('div');
                            let needsResize = true;
                            
                            while (needsResize && fontSize > 0.5) {
                                needsResize = false;
                                for (const lineDiv of lineDivs) {
                                    if (lineDiv.scrollWidth > responseDiv.clientWidth - 40) { // 40px for padding
                                        needsResize = true;
                                        fontSize -= 0.1;
                                        responseDiv.style.fontSize = fontSize + 'em';
                                        break;
                                    }
                                }
                            }
                            
                            // Now fade in
                            responseDiv.classList.add('show');
                        }, 50);
                    }, 2000); // Wait for fade to black to complete
                    
                    // Clear input on success
                    input.value = '';
                } else {
                    setTimeout(() => {
                        responseDiv.innerHTML = `<div class="error">Error: ${data.error || 'Unknown error occurred'}</div>`;
                        setTimeout(() => {
                            responseDiv.classList.add('show');
                        }, 100);
                    }, 2000);
                }
            } catch (error) {
                setTimeout(() => {
                    responseDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                    setTimeout(() => {
                        responseDiv.classList.add('show');
                    }, 100);
                }, 2000);
            } finally {
                // Re-enable controls
                button.disabled = false;
                input.disabled = false;
                // Don't focus input to prevent keyboard popup
            }
        }
    </script>
</body>
</html>
