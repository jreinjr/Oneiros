<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Phone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #4CAF50;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: #45a049;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .mic-button {
            background-color: #f44336;
            margin-left: 10px;
        }
        
        .mic-button:hover {
            background-color: #da190b;
        }
        
        .mic-button.recording {
            background-color: #ff5722;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .mic-icon {
            font-size: 20px;
        }
        
        #response {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
            display: none;
            text-align: left;
        }
        
        #response.show {
            display: block;
        }
        
        .error {
            color: #d32f2f;
        }
        
        .success {
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World</h1>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Enter your message" autofocus>
            <button id="sendButton" onclick="sendMessage()">Enter</button>
            <button id="micButton" class="mic-button" onclick="toggleSpeechRecognition()" title="Use microphone">
                <span class="mic-icon">🎤</span>
            </button>
        </div>
        <div id="response"></div>
    </div>

    <script>
        // Speech recognition variables
        let recognition = null;
        let isRecording = false;
        
        // Initialize speech recognition if available
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                isRecording = true;
                const micButton = document.getElementById('micButton');
                micButton.classList.add('recording');
                document.getElementById('messageInput').placeholder = 'Listening...';
            };
            
            recognition.onend = function() {
                isRecording = false;
                const micButton = document.getElementById('micButton');
                micButton.classList.remove('recording');
                document.getElementById('messageInput').placeholder = 'Enter your message';
            };
            
            recognition.onresult = function(event) {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                const input = document.getElementById('messageInput');
                if (finalTranscript) {
                    input.value = finalTranscript;
                } else {
                    input.value = interimTranscript;
                }
            };
            
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow microphone access to use this feature.');
                } else {
                    alert('Speech recognition error: ' + event.error);
                }
                stopRecording();
            };
        } else {
            // Hide mic button if speech recognition not supported
            document.getElementById('micButton').style.display = 'none';
        }
        
        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('Speech recognition is not supported in your browser.');
                return;
            }
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        function startRecording() {
            try {
                recognition.start();
            } catch (e) {
                console.error('Failed to start recognition:', e);
            }
        }
        
        function stopRecording() {
            if (recognition && isRecording) {
                recognition.stop();
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('messageInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            // Stop recording if active
            stopRecording();
            
            const input = document.getElementById('messageInput');
            const button = document.getElementById('sendButton');
            const responseDiv = document.getElementById('response');
            const message = input.value.trim();
            
            if (!message) {
                return;
            }
            
            // Disable button and input during request
            button.disabled = true;
            input.disabled = true;
            responseDiv.classList.remove('show');
            
            try {
                const response = await fetch('/listen', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    responseDiv.innerHTML = `<div class="success"><strong>Response:</strong><br>${data.user_response.message}</div>`;
                    responseDiv.classList.add('show');
                    // Clear input on success
                    input.value = '';
                } else {
                    responseDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${data.error || 'Unknown error occurred'}</div>`;
                    responseDiv.classList.add('show');
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${error.message}</div>`;
                responseDiv.classList.add('show');
            } finally {
                // Re-enable controls
                button.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
